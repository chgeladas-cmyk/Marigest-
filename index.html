<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marigest — Entradas e Saídas</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@media print{.no-print{display:none!important}}</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<header class="no-print bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="font-bold text-lg">Marigest</h1>
    <span id="status" class="text-xs font-semibold px-3 py-1 rounded-lg bg-amber-50 text-amber-700">Conectando...</span>
  </div>
</header>

<main class="max-w-4xl mx-auto p-4 space-y-4">
  <!-- Saldo total -->
  <div class="bg-slate-900 text-white p-5 rounded-2xl grid grid-cols-2 sm:grid-cols-4 gap-4">
    <div class="col-span-2 sm:col-span-1"><p class="text-[10px] font-bold text-slate-400 uppercase">Saldo total</p><p id="s-total" class="text-2xl font-black">R$ 0,00</p></div>
    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Dinheiro</p><p id="s-dinheiro" class="text-lg font-bold">R$ 0,00</p></div>
    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Pix</p><p id="s-pix" class="text-lg font-bold">R$ 0,00</p></div>
    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Cartão</p><p id="s-cartao" class="text-lg font-bold">R$ 0,00</p></div>
  </div>

  <div class="no-print flex gap-1 border-b border-slate-200">
    <button id="b-lanc" onclick="aba('lanc')" class="px-4 py-2.5 text-sm font-semibold border-b-2 border-blue-600 text-blue-600">Lançamentos</button>
    <button id="b-rel" onclick="aba('rel')" class="px-4 py-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-500">Relatórios</button>
  </div>

  <!-- LANÇAMENTOS -->
  <section id="t-lanc" class="space-y-4">
    <form onsubmit="salvarForm(event)" class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="tp-entrada" onclick="setTipo('entrada')" class="py-2 rounded-xl text-sm font-bold">Entrada</button>
        <button type="button" id="tp-saida" onclick="setTipo('saida')" class="py-2 rounded-xl text-sm font-bold">Saída</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <label class="text-xs font-bold text-slate-500 uppercase">Data<input type="date" id="f-data" required class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm font-semibold"></label>
        <label class="text-xs font-bold text-slate-500 uppercase">Valor (R$)<input type="number" step="0.01" min="0.01" id="f-valor" required placeholder="0,00" class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm font-semibold"></label>
        <label class="text-xs font-bold text-slate-500 uppercase"><span id="f-forma-l">Forma</span>
          <select id="f-forma" class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm font-semibold"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option><option value="cartao">Cartão</option></select></label>
      </div>
      <label class="block text-xs font-bold text-slate-500 uppercase">Descrição (opcional)<input type="text" id="f-desc" placeholder="Ex: pagamento fornecedor" class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm"></label>
      <div class="flex gap-2">
        <button type="button" id="f-cancel" onclick="cancelarEdicao()" class="hidden flex-1 py-2.5 bg-slate-100 rounded-xl text-sm font-bold">Cancelar</button>
        <button type="submit" id="f-submit" class="flex-1 py-2.5 text-white rounded-xl text-sm font-bold">Salvar</button>
      </div>
    </form>

    <div class="bg-white p-5 rounded-2xl border border-slate-200">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <div id="filtros" class="flex gap-1"></div>
        <input type="text" id="busca" oninput="renderLista()" placeholder="Buscar descrição..." class="flex-1 min-w-[140px] bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs">
        <button onclick="exportarCSV()" class="bg-slate-100 hover:bg-slate-200 text-xs font-semibold py-2 px-3 rounded-lg">CSV</button>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm text-left"><tbody id="lista" class="divide-y divide-slate-100"></tbody></table></div>
    </div>
  </section>

  <!-- RELATÓRIOS -->
  <section id="t-rel" class="hidden space-y-4">
    <div class="no-print bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap items-center gap-3">
      <select id="r-tipo" onchange="trocarRel()" class="bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold"><option value="dia">Diário</option><option value="semana">Semanal</option><option value="mes">Mensal</option><option value="ano">Anual</option></select>
      <input type="date" id="r-data" onchange="renderRel()" class="bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-semibold">
      <input type="month" id="r-mes" onchange="renderRel()" class="hidden bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-semibold">
      <input type="number" id="r-ano" min="2000" max="2100" onchange="renderRel()" class="hidden w-24 bg-slate-50 border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-semibold">
      <button onclick="window.print()" class="ml-auto bg-slate-100 hover:bg-slate-200 text-xs font-semibold py-2 px-3.5 rounded-lg">Imprimir / PDF</button>
    </div>
    <div id="rel" class="space-y-4"></div>
  </section>
</main>

<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc } from "firebase/firestore";

const app = initializeApp({
  apiKey: "AIzaSyAZN-1E2MpiKl9TQeUtHfbmBU729Dk5VbQ",
  authDomain: "margestch.firebaseapp.com",
  projectId: "margestch",
  storageBucket: "margestch.firebasestorage.app",
  messagingSenderId: "68222331424",
  appId: "1:68222331424:web:17b102bc69bed9c58caa45"
});
const auth = getAuth(app), db = getFirestore(app);
const col = collection(db, 'artifacts', 'default-app-id', 'public', 'data', 'lancamentos');
const LS = 'mg_lancamentos';

// ── Estado e utilitários ────────────────────────────────────
let lanc = [], local = false, editId = null, tipo = 'entrada', filtro = 'todos', unsub = null;
const FORMAS = { dinheiro: 'Dinheiro', pix: 'Pix', cartao: 'Cartão' };
const $ = id => document.getElementById(id);
const fmtR = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtBR = s => { if (!s) return '-'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hoje = () => isoLocal(new Date());
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function calc(list) {
  const e = { dinheiro: 0, pix: 0, cartao: 0 }, s = { dinheiro: 0, pix: 0, cartao: 0 };
  list.forEach(x => { (x.tipo === 'entrada' ? e : s)[x.forma] += x.valor || 0; });
  const ent = e.dinheiro + e.pix + e.cartao, sai = s.dinheiro + s.pix + s.cartao;
  return { e, s, ent, sai, total: ent - sai };
}

// ── Persistência (nuvem ou local) ───────────────────────────
function entrarModoLocal() {
  local = true; if (unsub) unsub();
  try { lanc = JSON.parse(localStorage.getItem(LS) || '[]'); } catch { lanc = []; }
  $('status').className = 'text-xs font-semibold px-3 py-1 rounded-lg bg-slate-100 text-slate-600';
  $('status').textContent = 'Modo local';
  render();
}
async function gravar(x) {
  if (local) {
    const i = lanc.findIndex(a => a.id === x.id);
    if (i >= 0) lanc[i] = x; else lanc.push(x);
    localStorage.setItem(LS, JSON.stringify(lanc)); render();
  } else await setDoc(doc(col, x.id), x);
}
async function remover(id) {
  if (local) { lanc = lanc.filter(a => a.id !== id); localStorage.setItem(LS, JSON.stringify(lanc)); render(); }
  else await deleteDoc(doc(col, id));
}
signInAnonymously(auth).catch(entrarModoLocal);
onAuthStateChanged(auth, user => {
  if (!user) return;
  $('status').className = 'text-xs font-semibold px-3 py-1 rounded-lg bg-emerald-50 text-emerald-700';
  $('status').textContent = 'Nuvem ativa';
  unsub = onSnapshot(col, snap => { lanc = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, entrarModoLocal);
});

// ── Formulário ──────────────────────────────────────────────
window.setTipo = t => {
  tipo = t;
  const on = { entrada: 'bg-emerald-600 text-white', saida: 'bg-red-600 text-white' }, off = 'bg-slate-100 text-slate-500';
  $('tp-entrada').className = `py-2 rounded-xl text-sm font-bold ${t === 'entrada' ? on.entrada : off}`;
  $('tp-saida').className = `py-2 rounded-xl text-sm font-bold ${t === 'saida' ? on.saida : off}`;
  $('f-submit').className = `flex-1 py-2.5 text-white rounded-xl text-sm font-bold ${t === 'entrada' ? 'bg-emerald-600' : 'bg-red-600'}`;
  $('f-forma-l').firstChild.textContent = t === 'entrada' ? 'Recebido em' : 'Pago com / sai de';
};
window.salvarForm = async e => {
  e.preventDefault();
  const valor = parseFloat($('f-valor').value);
  if (!(valor > 0)) return;
  const x = { id: editId || Date.now().toString(), tipo, data: $('f-data').value, valor, forma: $('f-forma').value, desc: $('f-desc').value.trim() };
  try { await gravar(x); cancelarEdicao(); } catch { alert('Erro ao salvar. Tente novamente.'); }
};
window.cancelarEdicao = () => {
  editId = null; $('f-valor').value = ''; $('f-desc').value = ''; $('f-data').value = hoje();
  $('f-cancel').classList.add('hidden'); $('f-submit').textContent = 'Salvar';
};
window.editar = id => {
  const x = lanc.find(a => a.id === id); if (!x) return;
  editId = id; setTipo(x.tipo);
  $('f-data').value = x.data; $('f-valor').value = x.valor; $('f-forma').value = x.forma; $('f-desc').value = x.desc || '';
  $('f-cancel').classList.remove('hidden'); $('f-submit').textContent = 'Atualizar';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
window.excluir = async id => {
  if (!confirm('Excluir este lançamento?')) return;
  try { await remover(id); } catch { alert('Erro ao excluir.'); }
};

// ── Lista e saldo ───────────────────────────────────────────
window.setFiltro = f => { filtro = f; renderLista(); };
window.renderLista = () => {
  $('filtros').innerHTML = [['todos', 'Todos'], ['entrada', 'Entradas'], ['saida', 'Saídas']].map(([k, n]) =>
    `<button onclick="setFiltro('${k}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${filtro === k ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}">${n}</button>`).join('');
  const b = $('busca').value.toLowerCase();
  const l = lanc.filter(x => (filtro === 'todos' || x.tipo === filtro) && (!b || (x.desc || '').toLowerCase().includes(b)))
    .sort((a, c) => a.data === c.data ? (a.id < c.id ? 1 : -1) : (a.data < c.data ? 1 : -1));
  $('lista').innerHTML = l.length ? l.map(x => {
    const ent = x.tipo === 'entrada';
    return `<tr><td class="py-2.5 pr-2 text-slate-500 whitespace-nowrap">${fmtBR(x.data)}</td>
      <td class="py-2.5 pr-2"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${ent ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">${ent ? 'Entrada' : 'Saída'}</span> <span class="text-xs text-slate-400">${FORMAS[x.forma] || x.forma}</span></td>
      <td class="py-2.5 pr-2">${esc(x.desc) || '<span class="text-slate-300">—</span>'}</td>
      <td class="py-2.5 pr-2 text-right font-bold whitespace-nowrap ${ent ? 'text-emerald-700' : 'text-red-700'}">${ent ? '+' : '−'} ${fmtR(x.valor)}</td>
      <td class="py-2.5 text-right whitespace-nowrap"><button onclick="editar('${x.id}')" class="text-xs px-2 py-1 bg-amber-50 text-amber-700 rounded-lg font-bold">Editar</button> <button onclick="excluir('${x.id}')" class="text-xs px-2 py-1 bg-rose-50 text-rose-600 rounded-lg font-bold">Excluir</button></td></tr>`;
  }).join('') : '<tr><td class="py-8 text-center text-slate-400 text-xs">Nenhum lançamento.</td></tr>';
};
function renderSaldo() {
  const s = calc(lanc), set = (id, v) => { $(id).textContent = fmtR(v); $(id).classList.toggle('text-rose-400', v < 0); };
  set('s-total', s.total);
  ['dinheiro', 'pix', 'cartao'].forEach(k => set('s-' + k, s.e[k] - s.s[k]));
}

// ── Relatórios ──────────────────────────────────────────────
window.trocarRel = () => {
  const t = $('r-tipo').value;
  if (!$('r-data').value) $('r-data').value = hoje();
  if (!$('r-mes').value) $('r-mes').value = hoje().slice(0, 7);
  if (!$('r-ano').value) $('r-ano').value = new Date().getFullYear();
  $('r-data').classList.toggle('hidden', !(t === 'dia' || t === 'semana'));
  $('r-mes').classList.toggle('hidden', t !== 'mes');
  $('r-ano').classList.toggle('hidden', t !== 'ano');
  renderRel();
};
window.renderRel = () => {
  const t = $('r-tipo').value, dv = $('r-data').value || hoje(), mv = $('r-mes').value || hoje().slice(0, 7), av = $('r-ano').value || new Date().getFullYear();
  let ini, fim, titulo;
  if (t === 'dia') { ini = fim = dv; titulo = 'Relatório diário — ' + fmtBR(dv); }
  else if (t === 'semana') {
    const d = new Date(dv + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    ini = isoLocal(d); d.setDate(d.getDate() + 6); fim = isoLocal(d);
    titulo = `Relatório semanal — ${fmtBR(ini)} a ${fmtBR(fim)}`;
  }
  else if (t === 'mes') { ini = mv + '-01'; fim = mv + '-31'; titulo = `Relatório mensal — ${mv.slice(5)}/${mv.slice(0, 4)}`; }
  else { ini = av + '-01-01'; fim = av + '-12-31'; titulo = 'Relatório anual — ' + av; }

  const l = lanc.filter(x => x.data >= ini && x.data <= fim), s = calc(l);
  const card = (n, v, c) => `<div class="bg-white p-4 rounded-2xl border border-slate-200"><p class="text-[10px] font-bold text-slate-400 uppercase">${n}</p><p class="text-xl font-extrabold ${c}">${fmtR(v)}</p></div>`;
  const tabela = (tit, cab, linhas) => `<div class="bg-white p-5 rounded-2xl border border-slate-200 overflow-x-auto"><h3 class="font-bold text-sm mb-3">${tit}</h3><table class="w-full text-sm text-left"><thead><tr class="text-xs text-slate-400 uppercase border-b border-slate-100">${cab.map((c, i) => `<th class="pb-2 font-semibold ${i ? 'text-right' : ''}">${c}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100">${linhas || `<tr><td colspan="${cab.length}" class="py-6 text-center text-slate-400 text-xs">Sem registros no período.</td></tr>`}</tbody></table></div>`;
  const neg = v => v < 0 ? 'text-rose-600' : '';

  const formas = Object.keys(FORMAS).map(k => `<tr><td class="py-2 font-semibold">${FORMAS[k]}</td><td class="py-2 text-right">${fmtR(s.e[k])}</td><td class="py-2 text-right text-red-600">${fmtR(s.s[k])}</td><td class="py-2 text-right font-bold ${neg(s.e[k] - s.s[k])}">${fmtR(s.e[k] - s.s[k])}</td></tr>`).join('');

  let quebra = '';
  if (t !== 'dia') {
    const g = {}, key = d => t === 'ano' ? d.slice(0, 7) : d;
    l.forEach(x => { const k = key(x.data); g[k] = g[k] || { e: 0, s: 0 }; g[k][x.tipo === 'entrada' ? 'e' : 's'] += x.valor; });
    const lin = Object.keys(g).sort().map(k => `<tr><td class="py-2">${t === 'ano' ? k.slice(5) + '/' + k.slice(0, 4) : fmtBR(k)}</td><td class="py-2 text-right">${fmtR(g[k].e)}</td><td class="py-2 text-right text-red-600">${fmtR(g[k].s)}</td><td class="py-2 text-right font-bold ${neg(g[k].e - g[k].s)}">${fmtR(g[k].e - g[k].s)}</td></tr>`).join('');
    quebra = tabela(t === 'ano' ? 'Por mês' : 'Por dia', [t === 'ano' ? 'Mês' : 'Dia', 'Entradas', 'Saídas', 'Saldo'], lin);
  }

  const det = tipoL => [...l].filter(x => x.tipo === tipoL).sort((a, b) => a.data < b.data ? 1 : -1)
    .map(x => `<tr><td class="py-2">${fmtBR(x.data)}</td><td class="py-2">${FORMAS[x.forma]}</td><td class="py-2 text-left">${esc(x.desc) || '-'}</td><td class="py-2 text-right font-bold">${fmtR(x.valor)}</td></tr>`).join('');

  $('rel').innerHTML = `<h2 class="font-bold text-lg">${titulo}</h2>
    <div class="grid grid-cols-3 gap-3">${card('Entradas', s.ent, 'text-emerald-700')}${card('Saídas', s.sai, 'text-red-700')}${card('Saldo do período', s.total, s.total < 0 ? 'text-rose-600' : 'text-blue-700')}</div>
    ${tabela('Por forma de pagamento', ['Forma', 'Entradas', 'Saídas', 'Saldo'], formas)}
    ${quebra}
    ${tabela('Entradas detalhadas', ['Data', 'Forma', 'Descrição', 'Valor'], det('entrada'))}
    ${tabela('Saídas detalhadas', ['Data', 'Forma', 'Descrição', 'Valor'], det('saida'))}`;
};

// ── Exportar CSV ────────────────────────────────────────────
window.exportarCSV = () => {
  if (!lanc.length) return alert('Nenhum lançamento.');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = [...lanc].sort((a, b) => a.data < b.data ? -1 : 1).map(x => [fmtBR(x.data), x.tipo === 'entrada' ? 'Entrada' : 'Saída', FORMAS[x.forma], q(x.desc), x.valor.toFixed(2).replace('.', ',')].join(';'));
  const blob = new Blob(['\uFEFFData;Tipo;Forma;Descrição;Valor\n' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Marigest_${hoje()}.csv`; a.click();
};

// ── Navegação e render geral ────────────────────────────────
window.aba = n => {
  ['lanc', 'rel'].forEach(k => {
    $('t-' + k).classList.toggle('hidden', k !== n);
    $('b-' + k).className = `px-4 py-2.5 text-sm font-semibold border-b-2 ${k === n ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500'}`;
  });
  if (n === 'rel') trocarRel();
};
function render() { renderSaldo(); renderLista(); if (!$('t-rel').classList.contains('hidden')) renderRel(); }
setTipo('entrada'); $('f-data').value = hoje(); render();
</script>
</body>
</html>
